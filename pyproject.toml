[project]
name = "retail-intelligence"
version = "0.1.0-dev"
description = "API for retail using transformer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Prateek Singhal", email = "prateek.singhal1988@gmail.com"}]  # cSpell:ignore Prateek
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.42.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "transformers>=5.4.0",
    "torch>=2.11.0",
    "sentence-transformers>=5.3.0",
    "faiss-cpu>=1.13.2",
    "kaggle>=2.0.0",
    "pandas>=3.0.2",
    "datasets>=4.8.4",
    "strawberry-graphql>=0.312.2"
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "ipykernel>=7.2.0",
    "mypy>=1.20.0",
    "notebook>=7.5.5",
    "poethepoet>=0.42.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# torchvision = { index = "pytorch-cpu" }

# 1. Explicitly set PyPI as the default for everything else (like Alembic)
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# 2. Set the PyTorch index as explicit-only
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poe]

[tool.poe.tasks]
# Development setup
develop = "pre-commit install"
pre-commit-check = "pre-commit run --all-files"

# Testing
test = "coverage run -m pytest"
coverage = "coverage report -m --skip-covered"
coverage-html = "coverage html -d coverage --skip-covered"

# Code quality
format = "ruff format ."
lint = "ruff check ."
fix = "ruff check --fix ."
sort = "ruff check --select I --fix ."
type-check = "mypy ."

# Run all checks
check = ["lint", "type-check", "test"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["shared", "data_service", "inference_service", "retrieval_service", "gateway_service", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*/routers/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "gateway_service", "data_service", "inference_service", "retrieval_service"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
strict = false
exclude = [
    "alembic/",
    "tests/",
    "data_service/tests/",
    "data_service/seed/",
    "inference_service/tests/",
    "retrieval_service/tests/",
    "gateway_service/tests/",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "data_service/tests",
    "inference_service/tests",
    "retrieval_service/tests",
    "gateway_service/tests",
]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
    "ignore:.*SwigPyPacked.*:DeprecationWarning",
    "ignore:.*SwigPyObject.*:DeprecationWarning",
    "ignore:.*swigvarlink.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["shared", "gateway_service", "data_service", "inference_service", "retrieval_service"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "data_service*",
    "inference_service*",
    "retrieval_service*",
    "gateway_service*",
]
