name: CI

on:
  push:
    branches-ignore:
      - master
      - develop
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install local packages
        run: uv pip install -e . --no-deps

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy . --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: uv run pytest -v
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail123
          POSTGRES_DB: retail_intelligence
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 6432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          API_KEY: dev-api-key-change-in-prod
          KAGGLE_API_TOKEN: dummy
          DEBUG: true

      - name: Docker build check
        run: |
          docker build -f data_service/Dockerfile . -t retail-data-service:test
          docker build -f inference_service/Dockerfile . -t retail-inference-service:test
          docker build -f retrieval_service/Dockerfile . -t retail-retrieval-service:test
          docker build -f gateway_service/Dockerfile . -t retail-gateway-service:test
