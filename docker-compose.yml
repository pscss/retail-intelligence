services:

  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  redis:
    image: redis:7-alpine
    container_name: retail_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  data-service:
    build:
      context: .
      dockerfile: data_service/Dockerfile
    container_name: retail_data_service
    env_file: .env.docker
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retail_network

  inference-service:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: retail_inference_service
    env_file: .env.docker
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - retail_network

  retrieval-service:
    build:
      context: .
      dockerfile: retrieval_service/Dockerfile
    container_name: retail_retrieval_service
    env_file: .env.docker
    ports:
      - "8002:8002"
    depends_on:
      data-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - retail_network

  gateway-service:
    build:
      context: .
      dockerfile: gateway_service/Dockerfile
    container_name: retail_gateway_service
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      data-service:
        condition: service_started
      inference-service:
        condition: service_started
      retrieval-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - retail_network

volumes:
  postgres_data:
  redis_data:

networks:
  retail_network:
    driver: bridge
